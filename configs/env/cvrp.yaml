_target_: parco.envs.cvrp.CVRPEnv
name: cvrp

generator_params:
  num_loc: 100 # max locs
  num_agents: 7 # max agents
  capacity: 50.0 # single capacity shared by ALL vehicles (homogeneous fleet)
  speed: 1.0 # unit speed, so the objective is max route LENGTH

data_dir: ${paths.root_dir}/data/${env.name}

# Generated by `python scripts/generate_cvrp_data.py` -- these do not ship with
# the repo and are not on HuggingFace, so run that script first.
# Validation is in-distribution (N in {50, 100}); N=200 is held out for testing.
val_file: [
  "n50_m3_seed24610.npz", "n50_m5_seed24610.npz", "n50_m7_seed24610.npz",
  "n100_m3_seed24610.npz", "n100_m5_seed24610.npz", "n100_m7_seed24610.npz",
]

# Note: we take the number of agents "m" from here directly!
val_dataloader_names: [
  "n50_m3", "n50_m5", "n50_m7",
  "n100_m3", "n100_m5", "n100_m7",
]

# Test additionally covers N=200, which is 2x the largest size seen in training
test_file: [
  "n50_m3_seed24610.npz", "n50_m5_seed24610.npz", "n50_m7_seed24610.npz",
  "n100_m3_seed24610.npz", "n100_m5_seed24610.npz", "n100_m7_seed24610.npz",
  "n200_m3_seed24610.npz", "n200_m5_seed24610.npz", "n200_m7_seed24610.npz",
]

test_dataloader_names: [
  "n50_m3", "n50_m5", "n50_m7",
  "n100_m3", "n100_m5", "n100_m7",
  "n200_m3", "n200_m5", "n200_m7",
]
